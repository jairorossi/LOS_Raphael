name: Build Custom ROM JairoEdition A14

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      DEVICE: raphael
      DEPMOD_BASE: out/target/product/raphael/obj/PACKAGING/depmod_vendor_intermediates/lib/modules

    steps:
      - name: Free Disk Space (Reclaim Host Space)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # fetch full history in case git operations from scripts need it
          fetch-depth: 0

      - name: Quick check: available disk
        run: |
          avail_kb=$(df --output=avail -k / | tail -n1)
          avail_gb=$((avail_kb/1024/1024))
          echo "Espaço disponível (GB): $avail_gb"
          if [ "$avail_gb" -lt 60 ]; then
            echo "Espaço livre < 60GB. Recomendo usar runner self-hosted com mais disco. Abortando."
            exit 1
          fi

      - name: Configure Swap Space (robusto)
        run: |
          set -e
          SWAP_SIZE_GB=16
          REQUIRED_BYTES=$((SWAP_SIZE_GB * 1024 * 1024 * 1024))
          avail_bytes=$(df --output=avail -B1 / | tail -n1)
          echo "Bytes disponíveis: $avail_bytes; necessários para swap ${SWAP_SIZE_GB}G: $REQUIRED_BYTES"
          if [ "$avail_bytes" -lt "$REQUIRED_BYTES" ]; then
            echo "Espaço insuficiente para criar swap. Abortando."
            exit 1
          fi
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          if sudo fallocate -l ${SWAP_SIZE_GB}G /swapfile; then
            echo "fallocate OK"
          else
            echo "fallocate falhou; usando dd como fallback"
            sudo dd if=/dev/zero of=/swapfile bs=1M count=$((SWAP_SIZE_GB*1024))
          fi
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32z1-dev \
            libelf-dev liblz4-tool lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev openjdk-11-jdk python3 python3-pip python-is-python3

      - name: Setup ccache cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
          # include local_manifests in the hash to reduce collisions when Android.bp come from repo sync
          key: ${{ runner.os }}-ccache-${{ hashFiles('local_manifests/**','**/Android.bp') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          mkdir -p ~/.ccache
          ccache -M 50G || true
          echo "CCACHE_DIR=~/.ccache"
          export CCACHE_DIR=~/.ccache
          export USE_CCACHE=1

      - name: Install Repo tool
        run: |
          mkdir -p ~/bin
          curl -sSfL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Configure Git & RAM Optimizations
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global pack.threads 1
          git config --global pack.windowMemory 256m
          git config --global pack.packSizeLimit 256m
          git config --global core.preloadIndex true
          git config --global core.symlinks true

      - name: Initialize ROM sources (LineageOS 19.1)
        run: |
          mkdir -p ~/android
          cd ~/android
          repo init -u https://github.com/LineageOS/android.git -b lineage-19.1 --depth=1 --groups=all,-notdefault,-darwin,-windows

      - name: Copy local manifests (if present)
        run: |
          if [ -f "$GITHUB_WORKSPACE/local_manifests/raphael.xml" ]; then
            mkdir -p ~/android/.repo/local_manifests
            cp "$GITHUB_WORKSPACE/local_manifests/raphael.xml" ~/android/.repo/local_manifests/
            echo "local_manifests/raphael.xml copiado"
          else
            echo "Aviso: local_manifests/raphael.xml não encontrado em $GITHUB_WORKSPACE/local_manifests/ - continuando sem ele"
            # Se esse arquivo for necessário, prefira falhar explicitamente:
            # exit 1
          fi

      - name: Configure SSH for repo sync (optional)
        if: ${{ secrets.REPO_SSH_KEY != '' }}
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.REPO_SSH_KEY }}

      - name: Add GitHub to known_hosts (only if using SSH)
        if: ${{ secrets.REPO_SSH_KEY != '' }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts || true

      - name: Sync ROM sources (safe)
        run: |
          cd ~/android
          REPO_JOBS=${REPO_JOBS:-2}
          echo "Repo sync j=${REPO_JOBS}"
          repo sync -c -j${REPO_JOBS} --force-sync --no-clone-bundle --no-tags || (echo "Retrying repo sync with j=1"; sleep 30; repo sync -c -j1 --force-sync --no-clone-bundle --no-tags)
          df -h
          # libera parte da meta-informacao para economizar espaço
          rm -rf .repo/projects .repo/project-objects || true

      - name: Apply patches and workspace fixes
        run: |
          cd ~/android
          # Relocations / patches – mantenha idempotente
          rm -rf hardware/qcom-caf/wlan || true
          if [ -d hardware/qcom/wlan ]; then
            mv hardware/qcom/wlan hardware/qcom-caf/wlan || true
            ln -sf ../qcom-caf/wlan hardware/qcom/wlan || true
            echo -e "soong_namespace {\n}" > hardware/qcom-caf/wlan/Android.bp || true
          fi
          mkdir -p hardware/qcom-caf/common/libqti-perfd-client
          echo -e "soong_namespace {\n}" > hardware/qcom-caf/common/libqti-perfd-client/Android.bp || true
          # Patches android.bp (use sed com cautela)
          if [ -f vendor/xiaomi/sm8150-common/Android.bp ]; then
            sed -i 's|"hardware/qcom-caf/sm8150"|"hardware/qcom-caf/sm8150", "hardware/qcom-caf/sm8350"|g' vendor/xiaomi/sm8150-common/Android.bp || true
            sed -i 's|libprotobuf-cpp-full-3.9.1-vendorcompat|libprotobuf-cpp-full-vendorcompat|g' vendor/xiaomi/sm8150-common/Android.bp || true
            sed -i 's|libprotobuf-cpp-lite-3.9.1-vendorcompat|libprotobuf-cpp-lite-vendorcompat|g' vendor/xiaomi/sm8150-common/Android.bp || true
          fi

      - name: Apply JairoEdition Customizations & Build
        run: |
          cd ~/android
          echo "=== Patching prebuilt depmod binaries in AOSP sources ==="
          if [ -f "$GITHUB_WORKSPACE/patch_depmod.py" ]; then
            python3 "$GITHUB_WORKSPACE/patch_depmod.py" || true
          else
            echo "Aviso: $GITHUB_WORKSPACE/patch_depmod.py não encontrado; pulando patch_depmod.py"
          fi

          echo "=== Creating dummy depmod modules structure ==="
          mkdir -p $DEPMOD_BASE/0.0
          mkdir -p $DEPMOD_BASE/4.14.180-perf
          touch $DEPMOD_BASE/0.0/modules.order || true
          touch $DEPMOD_BASE/0.0/modules.builtin || true
          touch $DEPMOD_BASE/4.14.180-perf/modules.order || true
          touch $DEPMOD_BASE/4.14.180-perf/modules.builtin || true

          device_mk="device/xiaomi/raphael/device.mk"
          if [ -f "$device_mk" ]; then
            echo "" >> $device_mk
            echo "# JairoEdition Custom Properties" >> $device_mk
            echo "PRODUCT_PROPERTY_OVERRIDES += ro.lineage.maintainer=\"Jairo Rossi\"" >> $device_mk
            echo "WITH_GAPPS := true" >> $device_mk
          fi

          # Pre-generate kernel .config
          if [ -d "kernel/xiaomi/sm8150" ]; then
            KDIR="kernel/xiaomi/sm8150"
          else
            KDIR="kernel/xiaomi/raphael"
          fi
          echo "Kernel directory: $KDIR"
          KCONF="vendor/sm8150-perf_defconfig"
          mkdir -p out/target/product/raphael/obj/KERNEL_OBJ
          make -C $KDIR O=../../../out/target/product/raphael/obj/KERNEL_OBJ ARCH=arm64 $KCONF || true

          for OBJDIR in DTB_OBJ DTBO_OBJ; do
            mkdir -p out/target/product/raphael/obj/$OBJDIR
            make -C $KDIR O=../../../out/target/product/raphael/obj/$OBJDIR ARCH=arm64 $KCONF || true
          done

          . build/envsetup.sh
          lunch lineage_raphael-userdebug

          # Ajusta jobs do mka para evitar OOM (usa nproc-1 quando possível)
          PROCS=$(nproc --all)
          if [ "$PROCS" -gt 1 ]; then
            MAKE_JOBS=$((PROCS-1))
          else
            MAKE_JOBS=1
          fi
          echo "Executando mka bacon -j${MAKE_JOBS}"
          mka bacon -j${MAKE_JOBS} || (echo "mka falhou"; exit 1)

      - name: Find built ROM
        id: find_artifact
        run: |
          shopt -s nullglob || true
          files=(/home/runner/android/out/target/product/raphael/lineage-19.1-*.zip)
          if [ ${#files[@]} -gt 0 ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "artifact=${files[0]}" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload compiled ROM to Artifacts
        if: steps.find_artifact.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: JairoEdition-ROM
          path: ${{ steps.find_artifact.outputs.artifact }}
          retention-days: 7
